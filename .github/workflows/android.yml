name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK Platform 35 & NDK
        run: |
          # Yahan hum explicit API 35 build tools aur NDK download kar rahe hain
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Create Dummy Folders & Properties
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          mkdir -p out

          # Paths ko config file mein overwrite karenge
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" >> local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build Launcher APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.apk
          
